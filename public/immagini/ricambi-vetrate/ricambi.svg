<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260">
  <rect width="400" height="260" fill="#fff7ed"/>
  <!-- due ante di vetro -->
  <g stroke="#64748b" stroke-width="6" fill="#dbeafe">
    <rect x="70" y="40" width="110" height="180" rx="4"/>
    <rect x="160" y="40" width="110" height="180" rx="4" fill="#bfdbfe"/>
  </g>
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <line x1="90" y1="70" x2="120" y2="100"/><line x1="185" y1="70" x2="215" y2="100"/>
  </g>
  <!-- binario -->
  <rect x="55" y="222" width="230" height="12" rx="3" fill="#475569"/>
  <!-- chiave inglese -->
  <g transform="translate(290 150) rotate(-40)">
    <rect x="-12" y="-10" width="24" height="95" rx="10" fill="#e97b36"/>
    <path d="M-30 -40 a32 32 0 1 0 60 0 l-14 0 l0 18 l-32 0 l0 -18 z" fill="#e97b36"/>
  </g>
  <!-- ingranaggio -->
  <g transform="translate(325 70)" fill="#94a3b8">
    <circle r="24"/>
    <g>
      <rect x="-6" y="-36" width="12" height="16"/><rect x="-6" y="20" width="12" height="16"/>
      <rect x="-36" y="-6" width="16" height="12"/><rect x="20" y="-6" width="16" height="12"/>
    </g>
    <circle r="9" fill="#fff7ed"/>
  </g>
</svg>
